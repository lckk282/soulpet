[project]
name = "soulpet"
version = "0.1.5"
description = "本地优先的私有 AI 宠物：可视化向导捏宠，配置、记忆、密钥全部留在你自己的机器上"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SoulPet contributors" }]
keywords = ["ai", "pet", "local-first", "fastapi", "vue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM105/B904：容错代码里 try-except-pass 比 contextlib.suppress 更好读
# UP028：流式生成器用 yield 循环更直观
ignore = ["E501", "B008", "SIM105", "B904", "UP028"]
