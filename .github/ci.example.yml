# 把本文件重命名为 ci.yml 即可启用 GitHub Actions。
# 原因：推送 .github/workflows/*.yml 需要 PAT 具备 workflow 权限，
# 所以默认以 .example 提供，克隆后自行改名即可。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 代码检查
        run: ruff check backend launcher tests
      - name: 格式检查
        run: ruff format --check backend launcher tests
      - name: 运行测试
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: frontend
      - name: 构建
        run: npm run build
        working-directory: frontend

  # 真开浏览器跑一遍「从零捏宠 → 提交 → 聊天」，防止 API 全绿但页面白屏这类回归
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium
      - name: 构建前端
        run: |
          cd frontend && npm ci && npm run build
      - name: UI 冒烟
        run: python tests/ui_smoke.py
